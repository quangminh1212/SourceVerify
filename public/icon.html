<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceVerify Icon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; background: #f8f9fa; font-family: 'Google Sans','Product Sans','Segoe UI',system-ui,sans-serif; padding: 48px 20px; }
        h2 { color: #5f6368; font-weight: 400; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
        .row { display: flex; align-items: flex-start; gap: 36px; flex-wrap: wrap; justify-content: center; }
        .preview { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .size { color: #9aa0a6; font-size: 11px; font-weight: 500; }
        .card { border-radius: 16px; padding: 28px; display: flex; align-items: center; justify-content: center; }
        .card-light { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .card-dark { background: #202124; }
        .brand { gap: 10px; padding: 14px 22px; }
        .brand-text { font-size: 19px; font-weight: 600; letter-spacing: -0.3px; }
        .dark-t { color: #e8eaed; }
        .light-t { color: #202124; }
        .divider { width: 100%; max-width: 600px; height: 1px; background: #dadce0; }
    </style>
</head>
<body>
    <h2>SourceVerify — Final Icon</h2>
    <div class="row">
        <div class="preview">
            <div class="card card-light">
                <svg width="96" height="96" viewBox="0 0 64 64" fill="none">
                    <defs><linearGradient id="g1" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#34A853"/><stop offset="33%" stop-color="#4285F4"/><stop offset="66%" stop-color="#EA4335"/><stop offset="100%" stop-color="#FBBC04"/></linearGradient></defs>
                    <circle cx="22" cy="22" r="14" fill="#4285F4" stroke="#fff" stroke-width="2.5"/><circle cx="42" cy="22" r="14" fill="#EA4335" stroke="#fff" stroke-width="2.5"/><circle cx="22" cy="42" r="14" fill="#34A853" stroke="#fff" stroke-width="2.5"/><circle cx="42" cy="42" r="14" fill="#FBBC04" stroke="#fff" stroke-width="2.5"/>
                    <path d="M22 32l5.5 5.5L42 23" stroke="url(#g1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 32l5.5 5.5L42 23" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">96px Light</span>
        </div>
        <div class="preview">
            <div class="card card-dark">
                <svg width="96" height="96" viewBox="0 0 64 64" fill="none">
                    <defs><linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#34A853"/><stop offset="33%" stop-color="#4285F4"/><stop offset="66%" stop-color="#EA4335"/><stop offset="100%" stop-color="#FBBC04"/></linearGradient></defs>

                    <path d="M22 32l5.5 5.5L42 23" stroke="url(#g2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 32l5.5 5.5L42 23" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">96px Dark</span>
        </div>
    </div>
    <div class="divider"></div>
