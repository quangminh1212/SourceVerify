<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceVerify Icon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            background: #f8f9fa;
            font-family: 'Google Sans', 'Product Sans', 'Segoe UI', system-ui, sans-serif;
            padding: 48px 20px;
        }
        h2 { color: #5f6368; font-weight: 400; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
        .row { display: flex; align-items: flex-start; gap: 36px; flex-wrap: wrap; justify-content: center; }
        .preview { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .size { color: #9aa0a6; font-size: 11px; font-weight: 500; }
        .card { border-radius: 16px; padding: 28px; display: flex; align-items: center; justify-content: center; }
        .card-light { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .card-dark { background: #202124; }
        .brand { gap: 10px; padding: 14px 22px; }
        .brand-text { font-size: 19px; font-weight: 600; letter-spacing: -0.3px; }
        .divider { width: 100%; max-width: 600px; height: 1px; background: #dadce0; }
    </style>
</head>
<body>

    <h2>Compare: Stroke vs Gap vs Both</h2>

    <div class="row">
        <!-- Current: stroke only -->
        <div class="preview">
            <div class="card card-dark">
                <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
                    <circle cx="22" cy="22" r="14.5" fill="#4285F4" stroke="#fff" stroke-width="2"/>
                    <circle cx="42" cy="22" r="14.5" fill="#EA4335" stroke="#fff" stroke-width="2"/>
                    <circle cx="22" cy="42" r="14.5" fill="#34A853" stroke="#fff" stroke-width="2"/>
                    <circle cx="42" cy="42" r="14.5" fill="#FBBC04" stroke="#fff" stroke-width="2"/>
                    <path d="M23 33l5.5 5.5L40 26" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Stroke 2px</span>
        </div>

        <!-- More gap, stroke -->
        <div class="preview">
            <div class="card card-dark">
                <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
                    <circle cx="20" cy="20" r="14" fill="#4285F4" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="20" r="14" fill="#EA4335" stroke="#fff" stroke-width="2"/>
                    <circle cx="20" cy="44" r="14" fill="#34A853" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="44" r="14" fill="#FBBC04" stroke="#fff" stroke-width="2"/>
                    <path d="M22 34l5.5 5.5L42 26" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Gap++ Stroke</span>
        </div>

        <!-- Wider gap, thicker stroke -->
        <div class="preview">
            <div class="card card-dark">
                <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
                    <circle cx="19" cy="19" r="13.5" fill="#4285F4" stroke="#fff" stroke-width="2.5"/>
                    <circle cx="45" cy="19" r="13.5" fill="#EA4335" stroke="#fff" stroke-width="2.5"/>
                    <circle cx="19" cy="45" r="13.5" fill="#34A853" stroke="#fff" stroke-width="2.5"/>
                    <circle cx="45" cy="45" r="13.5" fill="#FBBC04" stroke="#fff" stroke-width="2.5"/>
                    <path d="M21 34l5.5 5.5L43 25" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Wide gap + thick stroke</span>
        </div>

        <!-- Background-adaptive stroke -->
        <div class="preview">
            <div class="card card-dark">
                <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
                    <circle cx="19" cy="19" r="13.5" fill="#4285F4" stroke="#202124" stroke-width="2"/>
                    <circle cx="45" cy="19" r="13.5" fill="#EA4335" stroke="#202124" stroke-width="2"/>
                    <circle cx="19" cy="45" r="13.5" fill="#34A853" stroke="#202124" stroke-width="2"/>
                    <circle cx="45" cy="45" r="13.5" fill="#FBBC04" stroke="#202124" stroke-width="2"/>
                    <path d="M21 34l5.5 5.5L43 25" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Dark stroke (match bg)</span>
        </div>
    </div>

    <div class="divider"></div>
    <h2>Same on Light</h2>

    <div class="row">
        <div class="preview">
            <div class="card card-light">
                <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
                    <circle cx="22" cy="22" r="14.5" fill="#4285F4" stroke="#fff" stroke-width="2"/>
                    <circle cx="42" cy="22" r="14.5" fill="#EA4335" stroke="#fff" stroke-width="2"/>
                    <circle cx="22" cy="42" r="14.5" fill="#34A853" stroke="#fff" stroke-width="2"/>
                    <circle cx="42" cy="42" r="14.5" fill="#FBBC04" stroke="#fff" stroke-width="2"/>
                    <path d="M23 33l5.5 5.5L40 26" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Stroke 2px</span>
        </div>

        <div class="preview">
            <div class="card card-light">
                <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
                    <circle cx="20" cy="20" r="14" fill="#4285F4" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="20" r="14" fill="#EA4335" stroke="#fff" stroke-width="2"/>
                    <circle cx="20" cy="44" r="14" fill="#34A853" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="44" r="14" fill="#FBBC04" stroke="#fff" stroke-width="2"/>
                    <path d="M22 34l5.5 5.5L42 26" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Gap++ Stroke</span>
        </div>

        <div class="preview">
            <div class="card card-light">
                <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
                    <circle cx="19" cy="19" r="13.5" fill="#4285F4" stroke="#fff" stroke-width="2.5"/>
                    <circle cx="45" cy="19" r="13.5" fill="#EA4335" stroke="#fff" stroke-width="2.5"/>
                    <circle cx="19" cy="45" r="13.5" fill="#34A853" stroke="#fff" stroke-width="2.5"/>
                    <circle cx="45" cy="45" r="13.5" fill="#FBBC04" stroke="#fff" stroke-width="2.5"/>
                    <path d="M21 34l5.5 5.5L43 25" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Wide gap + thick stroke</span>
        </div>
    </div>

    <div class="divider"></div>
    <h2>Larger Preview (64px)</h2>

    <div class="row">
        <div class="preview">
            <div class="card card-light">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                    <circle cx="20" cy="20" r="14" fill="#4285F4" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="20" r="14" fill="#EA4335" stroke="#fff" stroke-width="2"/>
                    <circle cx="20" cy="44" r="14" fill="#34A853" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="44" r="14" fill="#FBBC04" stroke="#fff" stroke-width="2"/>
                    <path d="M22 34l5.5 5.5L42 26" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Gap++ Stroke 64px</span>
        </div>
        <div class="preview">
            <div class="card card-dark">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                    <circle cx="20" cy="20" r="14" fill="#4285F4" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="20" r="14" fill="#EA4335" stroke="#fff" stroke-width="2"/>
                    <circle cx="20" cy="44" r="14" fill="#34A853" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="44" r="14" fill="#FBBC04" stroke="#fff" stroke-width="2"/>
                    <path d="M22 34l5.5 5.5L42 26" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Gap++ Stroke 64px dark</span>
        </div>
    </div>

    <div class="divider"></div>
    <h2>Header Brand</h2>

    <div class="row">
        <div class="preview">
            <div class="card card-dark brand">
                <svg width="26" height="26" viewBox="0 0 64 64" fill="none">
                    <circle cx="20" cy="20" r="14" fill="#4285F4" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="20" r="14" fill="#EA4335" stroke="#fff" stroke-width="2"/>
                    <circle cx="20" cy="44" r="14" fill="#34A853" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="44" r="14" fill="#FBBC04" stroke="#fff" stroke-width="2"/>
                    <path d="M22 34l5.5 5.5L42 26" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="brand-text" style="color:#e8eaed">SourceVerify</span>
            </div>
            <span class="size">Dark header</span>
        </div>
        <div class="preview">
            <div class="card card-light brand">
                <svg width="26" height="26" viewBox="0 0 64 64" fill="none">
                    <circle cx="20" cy="20" r="14" fill="#4285F4" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="20" r="14" fill="#EA4335" stroke="#fff" stroke-width="2"/>
                    <circle cx="20" cy="44" r="14" fill="#34A853" stroke="#fff" stroke-width="2"/>
                    <circle cx="44" cy="44" r="14" fill="#FBBC04" stroke="#fff" stroke-width="2"/>
                    <path d="M22 34l5.5 5.5L42 26" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="brand-text" style="color:#202124">SourceVerify</span>
            </div>
            <span class="size">Light header</span>
        </div>
    </div>

</body>
</html>
