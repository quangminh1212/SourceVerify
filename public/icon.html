<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceVerify Icon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .preview .size { color: #888; font-size: 12px; }
        .bg-dark { background: #0f0f1a; border-radius: 12px; padding: 20px; }
        .bg-light { background: #f5f5f5; border-radius: 12px; padding: 20px; }

        /* Brand with text */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h2 style="color:#fff;font-weight:400;letter-spacing:1px;opacity:0.5">SourceVerify Icon — Google 4-Color</h2>

    <!-- Row 1: Various sizes on dark -->
    <div class="row">
        <div class="preview">
            <div class="bg-dark">
                <!-- 48px -->
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 6L2 12" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L8 18" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6L22 12L16 18" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13.5L11.5 16L16 10" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">48px</span>
        </div>

        <div class="preview">
            <div class="bg-dark">
                <!-- 32px -->
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 6L2 12" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L8 18" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6L22 12L16 18" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13.5L11.5 16L16 10" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">32px</span>
        </div>

        <div class="preview">
            <div class="bg-dark">
                <!-- 28px (header size) -->
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 6L2 12" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L8 18" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6L22 12L16 18" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13.5L11.5 16L16 10" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">28px (header)</span>
        </div>

        <div class="preview">
            <div class="bg-dark">
                <!-- 20px -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 6L2 12" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L8 18" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6L22 12L16 18" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13.5L11.5 16L16 10" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">20px</span>
        </div>
    </div>

    <!-- Row 2: Light backgrounds -->
    <div class="row">
        <div class="preview">
            <div class="bg-light">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 6L2 12" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L8 18" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6L22 12L16 18" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13.5L11.5 16L16 10" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Light 48px</span>
        </div>

        <div class="preview">
            <div class="bg-light">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 6L2 12" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L8 18" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6L22 12L16 18" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13.5L11.5 16L16 10" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="size">Light 28px</span>
        </div>
    </div>

    <!-- Row 3: Brand with text -->
    <div class="row">
        <div class="preview">
            <div class="bg-dark brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 6L2 12" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L8 18" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6L22 12L16 18" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13.5L11.5 16L16 10" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="brand-text">SourceVerify</span>
            </div>
            <span class="size">Header preview (dark)</span>
        </div>

        <div class="preview">
            <div class="bg-light brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 6L2 12" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L8 18" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6L22 12L16 18" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13.5L11.5 16L16 10" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="brand-text" style="color:#222">SourceVerify</span>
            </div>
            <span class="size">Header preview (light)</span>
        </div>
    </div>
</body>
</html>
